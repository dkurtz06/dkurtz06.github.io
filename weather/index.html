<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sky</title>
<meta name="theme-color" content="#0b1530" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sky" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icon-512.png" />
<link rel="manifest" href="manifest.json" />
<style>
:root{--bg1:#0b1530;--bg2:#1b3a7a;--card:rgba(255,255,255,.09);--line:rgba(255,255,255,.14);--ink:#fff;--dim:rgba(255,255,255,.66);--gold:#ffc94a;--red:#ff5d5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg1);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:linear-gradient(180deg,var(--bg2) 0%,var(--bg1) 70%);background-attachment:fixed;transition:background 1s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 40px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{display:flex;align-items:center;gap:8px}
.place{flex:1;display:flex;align-items:center;gap:6px;min-width:0;padding:10px 4px;font-weight:700;font-size:18px;text-align:left}
.place span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icobtn{width:44px;height:44px;border-radius:22px;background:var(--card);display:grid;place-items:center;font-size:18px;font-weight:700}
.hero{text-align:center;padding:18px 0 8px}
.hero .ico{font-size:64px;line-height:1;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.hero .t{font-size:104px;font-weight:200;letter-spacing:-4px;line-height:1;margin:6px 0 0 18px}
.hero .c{font-size:22px;font-weight:600}
.hero .s{color:var(--dim);margin-top:4px}
.headline{margin:14px auto 0;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:600}
.chips{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:8px -14px 0;padding-left:14px;padding-right:14px;scrollbar-width:none;background:linear-gradient(180deg,rgba(11,21,48,.85),rgba(11,21,48,0));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:36px;padding:0 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-top:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card h2{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.alert{background:linear-gradient(135deg,rgba(255,80,80,.35),rgba(255,140,60,.25));border-color:rgba(255,120,100,.6)}
.alert .ev{font-weight:800;font-size:17px}
.alert details{margin-top:8px}.alert summary{cursor:pointer;color:var(--dim);font-size:14px}
.alert pre{white-space:pre-wrap;font:13px/1.4 inherit;margin:8px 0 0}
.mins{display:flex;align-items:flex-end;gap:4px;height:70px}
.mins div{flex:1;background:linear-gradient(180deg,#6fc3ff,#2b7de0);border-radius:4px 4px 2px 2px;min-height:3px;opacity:.95}
.mins div.z{background:rgba(255,255,255,.15)}
.minlbl{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-top:6px}
.hours{overflow-x:auto;margin:0 -14px;padding:0 14px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hgrid{position:relative}
.hrow{display:flex}
.h{flex:0 0 58px;text-align:center;font-size:14px}
.h .hl{color:var(--dim);font-size:12px;font-weight:600}
.h .hi{font-size:24px;margin:6px 0 4px}
.h .hp{color:#7fd0ff;font-size:12px;height:15px;font-weight:600}
.h.now .hl{color:var(--gold)}
.h.day .hl{color:#fff;background:rgba(255,255,255,.15);border-radius:8px}
#tline{display:block;margin-top:4px}
.days .d{display:grid;grid-template-columns:62px 34px 40px 1fr 40px;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.days .d:first-child{border-top:0}
.days .dn{font-weight:700}.days .dn small{display:block;color:var(--dim);font-weight:500;font-size:12px}
.days .di{font-size:24px;text-align:center}
.days .dp{color:#7fd0ff;font-size:12px;font-weight:700;text-align:center}
.days .lo{color:var(--dim);text-align:right}.days .hi2{text-align:left;font-weight:700}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#5ec8ff,#9be37a,#ffd24a,#ff8a3d)}
.bar b{position:absolute;top:-3px;width:12px;height:12px;border-radius:6px;background:#fff;border:2px solid var(--bg1);margin-left:-6px}
.ddet{display:none;grid-column:1/-1;color:var(--dim);font-size:13px;padding:6px 0 2px}
.d.open .ddet{display:block}
#map{height:360px;border-radius:16px;overflow:hidden;background:#222}
.rctl{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.pill{min-height:40px;padding:0 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-weight:700}
.pill.on{background:var(--gold);color:#1a1300;border-color:var(--gold)}
#rtime{font-weight:700;margin-left:auto}
.scrub{width:100%;margin-top:10px;accent-color:var(--gold)}
.legend{height:8px;border-radius:4px;margin-top:10px;background:linear-gradient(90deg,#04e9e7,#019ff4,#0300f4,#02fd02,#01c501,#008e00,#fdf802,#e5bc00,#fd9500,#fd0000,#d40000,#bc0000,#f800fd,#9854c6)}
.leglbl{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.grid .card{margin-top:0;min-height:150px;display:flex;flex-direction:column}
.big{font-size:34px;font-weight:300;line-height:1.1}
.sub{color:var(--dim);font-size:13px;margin-top:auto;padding-top:8px}
.meter{height:6px;border-radius:3px;margin-top:10px;position:relative}
.meter b{position:absolute;top:-3px;width:12px;height:12px;border-radius:6px;background:#fff;border:2px solid var(--bg1);margin-left:-6px}
.uvm{background:linear-gradient(90deg,#3ec46d,#f2d33c,#f39c35,#e8463f,#9b4fd6)}
.aqm{background:linear-gradient(90deg,#3ec46d,#f2d33c,#f39c35,#e8463f,#9b4fd6,#7e2738)}
.wide{grid-column:1/-1}
.foot{color:var(--dim);font-size:12px;text-align:center;margin-top:22px;line-height:1.6}
.foot a{color:var(--dim)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,10,25,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none}
.sheet.open{display:block}
.sheet .in{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 20px}
.srch{display:flex;gap:8px}
.srch input{flex:1;min-height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font-size:17px;padding:0 14px;outline:none}
.list button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--card);margin-top:8px;min-height:52px}
.list small{color:var(--dim)}
.x{color:var(--dim);font-size:20px;padding:0 6px}
.loading{text-align:center;color:var(--dim);padding:60px 0}
.err{color:#ffb3b3}
.leaflet-container{background:#1d1d1d}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <button class="place" id="placeBtn" aria-label="Change location"><span id="placeName">Locating…</span> <small>▾</small></button>
    <button class="icobtn" id="gpsBtn" aria-label="Use my location">➤</button>
    <button class="icobtn" id="unitBtn" aria-label="Switch units">°F</button>
  </div>
  <div id="app"><div class="loading">Reading the sky…</div></div>
  <div class="foot" id="foot"></div>
</div>

<div class="sheet" id="sheet">
  <div class="in">
    <div class="srch"><input id="q" placeholder="Search a city or ZIP" autocomplete="off" enterkeyhint="search" /><button class="pill" id="closeS">Done</button></div>
    <div class="list" id="results"></div>
    <div class="list" id="saved"></div>
  </div>
</div>

<script>
(function(){
"use strict";
const HOME={lat:39.6635,lon:-86.0266,name:"Home"};
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem("sky_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("sky_"+k,JSON.stringify(v))}catch(e){}}};
let unit=LS.get("unit","F");
let loc=LS.get("loc",null);
let data=null, aq=null, alerts=[];
const W={
0:["Clear","☀️","🌙"],1:["Mostly clear","🌤️","🌙"],2:["Partly cloudy","⛅","☁️"],3:["Cloudy","☁️","☁️"],
45:["Fog","🌫️","🌫️"],48:["Freezing fog","🌫️","🌫️"],
51:["Light drizzle","🌦️","🌧️"],53:["Drizzle","🌦️","🌧️"],55:["Heavy drizzle","🌧️","🌧️"],56:["Freezing drizzle","🌧️","🌧️"],57:["Freezing drizzle","🌧️","🌧️"],
61:["Light rain","🌦️","🌧️"],63:["Rain","🌧️","🌧️"],65:["Heavy rain","🌧️","🌧️"],66:["Freezing rain","🧊","🧊"],67:["Freezing rain","🧊","🧊"],
71:["Light snow","🌨️","🌨️"],73:["Snow","🌨️","🌨️"],75:["Heavy snow","❄️","❄️"],77:["Snow grains","🌨️","🌨️"],
80:["Showers","🌦️","🌧️"],81:["Showers","🌧️","🌧️"],82:["Downpours","⛈️","⛈️"],85:["Snow showers","🌨️","🌨️"],86:["Snow showers","❄️","❄️"],
95:["Thunderstorms","⛈️","⛈️"],96:["Storms with hail","⛈️","⛈️"],99:["Storms with hail","⛈️","⛈️"]};
const wx=(c,day)=>{const w=W[c]||W[3];return {txt:w[0],ico:day===0?w[2]:w[1]}};
const T=f=>f==null||isNaN(f)?"–":Math.round(unit==="F"?f:(f-32)*5/9)+"°";
const SPD=m=>unit==="F"?Math.round(m)+" mph":Math.round(m*1.609)+" km/h";
const LEN=i=>unit==="F"?(i<0.01&&i>0?"<0.01":i.toFixed(2))+" in":(i*25.4).toFixed(1)+" mm";
const DIRS=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const dir=d=>DIRS[Math.round(((d%360)+360)%360/22.5)%16];
const hhmm=s=>{const h=+s.slice(11,13),m=s.slice(14,16);return ((h%12)||12)+(m!=="00"?":"+m:"")+(h<12?" AM":" PM")};
const hr=s=>{const h=+s.slice(11,13);return ((h%12)||12)+(h<12?"a":"p")};
const dname=(s,i)=>i===0?"Today":new Date(s+"T12:00").toLocaleDateString("en-US",{weekday:"short"});
const ddate=s=>new Date(s+"T12:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const j=(u,o)=>fetch(u,o).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(x=>{if(x&&x.error)throw new Error(x.reason||"err");return x});

/* ---------- data ---------- */
function omURL(l){
  return "https://api.open-meteo.com/v1/forecast?latitude="+l.lat+"&longitude="+l.lon+
  "&current=temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility,uv_index"+
  "&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,is_day,uv_index"+
  "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,uv_index_max,wind_speed_10m_max,wind_gusts_10m_max,snowfall_sum"+
  "&minutely_15=precipitation&forecast_minutely_15=12&past_minutely_15=0"+
  "&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto&forecast_days=16&forecast_hours=48";
}
function nwsCode(t){t=(t||"").toLowerCase();
  if(/thunder|storm/.test(t))return 95; if(/freezing/.test(t))return 66; if(/snow|flurr/.test(t))return /heavy/.test(t)?75:/light|chance|slight/.test(t)?71:73;
  if(/shower/.test(t))return 80; if(/drizzle/.test(t))return 53; if(/rain/.test(t))return /heavy/.test(t)?65:/light|chance|slight/.test(t)?61:63;
  if(/fog|haze|smoke/.test(t))return 45; if(/overcast|^cloudy|mostly cloudy/.test(t))return 3; if(/partly/.test(t))return 2; if(/mostly sunny|mostly clear/.test(t))return 1; return 0}
async function nwsFallback(l){
  const H={headers:{Accept:"application/geo+json"}};
  const p=await j("https://api.weather.gov/points/"+l.lat.toFixed(4)+","+l.lon.toFixed(4),H);
  const [fh,fd]=await Promise.all([j(p.properties.forecastHourly,H),j(p.properties.forecast,H)]);
  const loc=s=>s.slice(0,16);
  const hp=fh.properties.periods.slice(0,48);
  const mph=w=>{const m=(w||"").match(/\d+/g);return m?+m[m.length-1]:0};
  const hourly={time:hp.map(x=>loc(x.startTime)),temperature_2m:hp.map(x=>x.temperature),apparent_temperature:hp.map(x=>x.temperature),
    precipitation_probability:hp.map(x=>(x.probabilityOfPrecipitation||{}).value||0),precipitation:hp.map(()=>0),
    weather_code:hp.map(x=>nwsCode(x.shortForecast)),wind_speed_10m:hp.map(x=>mph(x.windSpeed)),is_day:hp.map(x=>x.isDaytime?1:0),uv_index:hp.map(()=>null)};
  const dp=fd.properties.periods; const days=[];
  for(let i=0;i<dp.length;i++){const x=dp[i],d=x.startTime.slice(0,10);let o=days.find(z=>z.d===d);if(!o){o={d,max:null,min:null,code:nwsCode(x.shortForecast),pp:0,txt:x.detailedForecast};days.push(o)}
    if(x.isDaytime){o.max=x.temperature;o.code=nwsCode(x.shortForecast);o.txt=x.detailedForecast}else o.min=x.temperature;o.pp=Math.max(o.pp,(x.probabilityOfPrecipitation||{}).value||0)}
  const h0=hp[0];
  return {source:"nws",utc_offset_seconds:0,
    current:{time:loc(h0.startTime),temperature_2m:h0.temperature,apparent_temperature:h0.temperature,relative_humidity_2m:(h0.relativeHumidity||{}).value,
      dew_point_2m:h0.dewpoint&&h0.dewpoint.value!=null?h0.dewpoint.value*9/5+32:null,is_day:h0.isDaytime?1:0,weather_code:nwsCode(h0.shortForecast),
      wind_speed_10m:mph(h0.windSpeed),wind_direction_10m:DIRS.indexOf(h0.windDirection)*22.5,wind_gusts_10m:null,pressure_msl:null,visibility:null,uv_index:null,cloud_cover:null},
    hourly,
    daily:{time:days.map(z=>z.d),weather_code:days.map(z=>z.code),temperature_2m_max:days.map(z=>z.max??hourly.temperature_2m[0]),temperature_2m_min:days.map(z=>z.min??z.max),
      precipitation_sum:days.map(()=>null),precipitation_probability_max:days.map(z=>z.pp),sunrise:days.map(()=>null),sunset:days.map(()=>null),uv_index_max:days.map(()=>null),
      wind_speed_10m_max:days.map(()=>null),wind_gusts_10m_max:days.map(()=>null),snowfall_sum:days.map(()=>null),txt:days.map(z=>z.txt)}};
}
async function load(l){
  $("app").innerHTML='<div class="loading">Reading the sky…</div>';
  $("placeName").textContent=l.name||"Here";
  let d=null;
  try{d=await j(omURL(l));d.source="om"}catch(e){try{d=await nwsFallback(l)}catch(e2){d=null}}
  if(!d){$("app").innerHTML='<div class="loading err">Couldn\'t reach the weather services. Check your signal and tap ➤ to retry.</div>';return}
  data=d; LS.set("cache",{l,d,t:Date.now()});
  aq=null; alerts=[];
  render();
  j("https://air-quality-api.open-meteo.com/v1/air-quality?latitude="+l.lat+"&longitude="+l.lon+"&current=us_aqi,pm2_5,pm10,ozone&timezone=auto").then(x=>{aq=x.current;renderDetails()}).catch(()=>{});
  j("https://api.weather.gov/alerts/active?point="+l.lat.toFixed(4)+","+l.lon.toFixed(4),{headers:{Accept:"application/geo+json"}}).then(x=>{alerts=(x.features||[]).map(f=>f.properties);renderAlerts()}).catch(()=>{});
}

/* ---------- render ---------- */
function nowIdx(){const h=data.hourly.time,c=data.current.time.slice(0,13);let i=h.findIndex(t=>t.slice(0,13)===c);return i<0?0:i}
function headline(){
  const m=data.minutely_15;
  if(m&&m.precipitation){
    const ct=data.current.time;const pr=m.precipitation, tm=m.time;let s=tm.findIndex(t=>t>=ct.slice(0,16));if(s<0)s=0;
    const wet=v=>v>=0.004; const rainingNow=wet(data.current.precipitation||0)||wet(pr[s]||0);
    if(rainingNow){for(let k=s;k<pr.length;k++){if(!wet(pr[k]))return "Precipitation should ease around "+hhmm(tm[k])+"."}return "Precipitation continues for at least the next 2 hours."}
    for(let k=s;k<Math.min(pr.length,s+8);k++){if(wet(pr[k])){const mins=(k-s)*15;return mins<=15?"Precipitation starting within 15 minutes.":"Precipitation starting around "+hhmm(tm[k])+"."}}
  }
  const i=nowIdx(),H=data.hourly;
  for(let k=i;k<Math.min(i+12,H.time.length);k++){if((H.precipitation_probability[k]||0)>=50){return (k===i?"Precipitation likely now":"Precipitation likely around "+hhmm(H.time[k]))+" ("+H.precipitation_probability[k]+"%)."}}
  const D=data.daily;const tmr=D.precipitation_probability_max[1];
  return "No precipitation expected for the next 12 hours"+(tmr>=50?", but "+tmr+"% chance tomorrow.":".");
}
function render(){
  const C=data.current,D=data.daily,H=data.hourly;const w=wx(C.weather_code,C.is_day);
  setSky(C.weather_code,C.is_day);
  const hasMin=data.minutely_15&&data.minutely_15.precipitation;
  $("app").innerHTML=
  '<div class="hero"><div class="ico">'+w.ico+'</div><div class="t">'+T(C.temperature_2m)+'</div><div class="c">'+w.txt+'</div>'+
  '<div class="s">Feels like '+T(C.apparent_temperature)+' · H '+T(D.temperature_2m_max[0])+' L '+T(D.temperature_2m_min[0])+'</div>'+
  '<div class="headline">'+esc(headline())+'</div></div>'+
  '<div class="chips"><button class="chip" data-go="cAlerts" id="chipAlert" style="display:none">⚠️ Alerts</button><button class="chip" data-go="cHours">Hourly</button><button class="chip" data-go="cDays">'+D.time.length+'-Day</button><button class="chip" data-go="cRadar">Radar</button><button class="chip" data-go="cDet">Details</button></div>'+
  '<div id="cAlerts"></div>'+
  (hasMin?'<div class="card" id="cMin"><h2>Next 3 hours</h2><div class="mins" id="mins"></div><div class="minlbl" id="minlbl"></div></div>':'')+
  '<div class="card" id="cHours"><h2>Hourly <span>48 hrs</span></h2><div class="hours"><div class="hgrid" id="hgrid"></div></div></div>'+
  '<div class="card" id="cDays"><h2>'+D.time.length+'-day forecast <span>tap a day</span></h2><div class="days" id="days"></div></div>'+
  '<div class="card" id="cRadar"><h2>Live radar</h2><div class="rctl"><button class="pill on" id="rPlay">Pause</button><button class="pill" id="rHere">Here</button><button class="pill" id="rZoom">Region</button><span id="rtime"></span></div><div id="map"></div><input type="range" class="scrub" id="rScrub" min="0" max="10" value="10" /><div class="legend"></div><div class="leglbl"><span>Light</span><span>Heavy</span><span>Hail</span></div></div>'+
  '<div id="cDet"></div>';
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const e=$(b.dataset.go);if(e)window.scrollTo({top:e.getBoundingClientRect().top+scrollY-60,behavior:"smooth"})});
  if(hasMin)renderMins(); renderHours(); renderDays(); renderDetails(); renderAlerts(); radar();
  $("unitBtn").textContent="°"+unit;

function loadLeaflet(cb){if(window.L&&L.map)return cb(true);if(LFs==="fail")return cb(false);LFq.push(cb);if(LFs==="loading")return;LFs="loading";
  const done=ok=>{if(LFs!=="loading")return;LFs=ok?"ok":"fail";const q=LFq;LFq=[];q.forEach(f=>f(ok))};
  const c=document.createElement("link");c.rel="stylesheet";c.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.appendChild(c);
  const s=document.createElement("script");s.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";s.onload=()=>done(!!(window.L&&L.map));s.onerror=()=>done(false);setTimeout(()=>done(!!(window.L&&L.map)),12000);document.head.appendChild(s)}

let FX={kind:null,parts:[],raf:0};
function setSky(code,day){
  const st=document.documentElement.style;let a,b;
  const storm=code>=95,rain=(code>=51&&code<=67)||(code>=80&&code<=82),snow=(code>=71&&code<=77)||code>=85&&code<=86,cloud=code===3||code===45||code===48,part=code===2;
  if(!day){a=storm?"#1a1530":cloud||rain?"#1a2233":"#141e46";b="#060a18"}
  else if(storm){a="#3b3f5c";b="#15172a"}else if(rain){a="#4b6280";b="#1a2638"}else if(snow){a="#8aa3c2";b="#2d3e5c"}else if(cloud){a="#6a7f9c";b="#24324d"}else if(part){a="#3b78d0";b="#14306a"}else{a="#2f8cf0";b="#0f3a85"}
  st.setProperty("--bg2",a);st.setProperty("--bg1",b);document.querySelector('meta[name=theme-color]').content=b;
  startFX(storm||rain?"rain":snow?"snow":!day&&code<=1?"stars":null,storm);
}
function startFX(kind,storm){
  const cv=$("fx"),cx=cv.getContext("2d");cancelAnimationFrame(FX.raf);
  const dpr=Math.min(2,devicePixelRatio||1);const rs=()=>{cv.width=innerWidth*dpr;cv.height=innerHeight*dpr};rs();onresize=rs;
  cx.clearRect(0,0,cv.width,cv.height);if(!kind)return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const N=kind==="rain"?120:kind==="snow"?90:110;FX.parts=[];
  for(let i=0;i<N;i++)FX.parts.push({x:Math.random(),y:Math.random(),v:kind==="rain"?.012+Math.random()*.01:kind==="snow"?.0012+Math.random()*.0015:0,s:Math.random(),p:Math.random()*6.28});
  let flash=0;
  const step=()=>{const W2=cv.width,H2=cv.height;cx.clearRect(0,0,W2,H2);
    if(storm&&Math.random()<.004)flash=1;if(flash>0){cx.fillStyle="rgba(220,230,255,"+(flash*.35)+")";cx.fillRect(0,0,W2,H2);flash-=.06}
    for(const p of FX.parts){
      if(kind==="rain"){p.y+=p.v;p.x+=.002;if(p.y>1){p.y=-.05;p.x=Math.random()}cx.strokeStyle="rgba(180,210,255,"+(.25+p.s*.3)+")";cx.lineWidth=dpr;cx.beginPath();cx.moveTo(p.x*W2,p.y*H2);cx.lineTo(p.x*W2+3*dpr,p.y*H2+14*dpr);cx.stroke()}
      else if(kind==="snow"){p.y+=p.v;p.p+=.02;if(p.y>1){p.y=-.02;p.x=Math.random()}cx.fillStyle="rgba(255,255,255,"+(.5+p.s*.4)+")";cx.beginPath();cx.arc((p.x+Math.sin(p.p)*.01)*W2,p.y*H2,(1+p.s*2.2)*dpr,0,6.28);cx.fill()}
      else{p.p+=.03;cx.fillStyle="rgba(255,255,255,"+(.3+.5*Math.abs(Math.sin(p.p))*p.s)+")";cx.fillRect(p.x*W2,p.y*H2*.6,1.4*dpr,1.4*dpr)}}
    FX.raf=requestAnimationFrame(step)};
  step();
}

async function search(q){

if(cache&&cache.d&&Date.now()-cache.t<20*60000){loc=cache.l;data=cache.d;$("placeName").textContent=loc.name;render()}
if(!loc||loc.gps)useGPS();else load(loc);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&loc){const c=LS.get("cache",null);if(!c||Date.now()-c.t>10*60000)load(loc)}});
})();
</script>
</body>
</html>
